<svg width="2600" height="1000" viewBox="0 0 2600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes wave {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-35px); }
    50% { transform: translateY(0); }
  }
  .bg { fill: none; }
  .letter-0 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0s; }
  .letter-1 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.18s; }
</style>

<!-- Icon (with clip) -->
<g class="icon-group" clip-path="url(#icon-clip)">
<image href="icon-192.png" x="0" y="0" width="1000" height="1000" preserveAspectRatio="xMidYMid slice" />
</g>

<!-- Wordmark: 蓬蓬 (wave animation per glyph) -->
<g class="letter-0">
<text x="1230" y="500" fill="currentColor" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="760" font-weight="700" letter-spacing="40" dominant-baseline="central">蓬</text>
</g>
<g class="letter-1">
<text x="2010" y="500" fill="currentColor" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="760" font-weight="700" letter-spacing="40" dominant-baseline="central">蓬</text>
</g>

<defs>
<clipPath id="icon-clip">
<rect width="1000" height="1000" rx="181" fill="currentColor" />
</clipPath>
</defs>
</svg>
